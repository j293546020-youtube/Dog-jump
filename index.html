<!DOCTYPE html><html><head>  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#78cfff">
  <title>Dog Jump</title>
</head>
<body><div id="mainMenu">  <h1 class="title">
    <span>D</span><span>O</span><span>G</span>
    <span>J</span><span>U</span><span>M</span><span>P</span>
  </h1>  <button id="playButton" class="bigButton">
    🐾
  </button>  <button id="dogsButton" class="menuButton">
    🐶 DOGS
  </button>  <div id="bestScore">
    BEST: 0m
  </div>  <button id="saveButton" class="smallButton">
    💾 SAVE CODE
  </button>  <button id="loadButton" class="smallButton">
    📥 LOAD CODE
  </button></div><div id="dogsScreen">  <h1 class="screenTitle">
    DOGS
  </h1>  <div class="dog-grid"><button class="dog-card" data-dog="street">
  <div class="dog-preview street-preview">🐕</div>
  <div class="dog-name">Street Dog</div>
  <div class="dog-status">STARTER</div>
</button><button class="dog-card" data-dog="romantic">
  <div class="dog-preview romantic-preview">💕</div>
  <div class="dog-name">Romantic Dog</div>
  <div class="dog-status">🔒 100m</div>
</button><button class="dog-card" data-dog="stray">
  <div class="dog-preview stray-preview">🐾</div>
  <div class="dog-name">Stray Dog</div>
  <div class="dog-status">🔒 200m</div>
</button><button class="dog-card" data-dog="persian">
  <div class="dog-preview persian-preview">🐱</div>
  <div class="dog-name">Persian Dog</div>
  <div class="dog-status">🔒 300m</div>
</button><button class="dog-card" data-dog="love">
  <div class="dog-preview love-preview">❤️</div>
  <div class="dog-name">Love Dog</div>
  <div class="dog-status">🔒 400m</div>
</button><button class="dog-card" data-dog="bad">
  <div class="dog-preview bad-preview">😈</div>
  <div class="dog-name">Bad Dog</div>
  <div class="dog-status">🔒 500m</div>
</button><button class="dog-card" data-dog="pretty">
  <div class="dog-preview pretty-preview">✨</div>
  <div class="dog-name">Pretty Dog</div>
  <div class="dog-status">🔒 600m</div>
</button><button class="dog-card" data-dog="police">
  <div class="dog-preview police-preview">👮</div>
  <div class="dog-name">Police Dog</div>
  <div class="dog-status">🔒 700m</div>
</button>  </div>  <button id="backButton">
    ⬅ BACK
  </button></div><div id="gameScreen">  <div id="score">
    0m
  </div>  <div id="invincibility">
    🛡️ 3
  </div>  <div id="obstacleWarning"></div>  <div id="gameOverFlash"></div>  <div id="leftWall"></div>
  <div id="rightWall"></div>  <div id="gameWorld"><div id="gear">⚙️</div><div id="spike">
  <div class="spike-point"></div>
  <div class="spike-point"></div>
  <div class="spike-point"></div>
</div><div id="cannon">
  <div class="cannon-barrel"></div>
  <div class="cannon-body"></div>
  <div class="cannon-wheel cannon-wheel-left"></div>
  <div class="cannon-wheel cannon-wheel-right"></div>
</div><div id="electricWire">
  <div class="wire-line"></div>
  <div class="wire-countdown">3</div>
</div><div id="beam">
  <div class="beam-stick"></div>
  <div class="beam-laser"></div>
  <div class="beam-warning">⚠</div>
</div><div id="slimeWall"></div><div id="portal">
  <div class="portal-inner"></div>
</div><div id="mace">
  <div class="mace-chain"></div>
  <div class="mace-head">🔨</div>
</div><div id="fireSpinner">
  <div class="fire-ball fire1">🔥</div>
  <div class="fire-ball fire2">🔥</div>
  <div class="fire-ball fire3">🔥</div>
  <div class="fire-core">🔥</div>
</div><div id="boxingGlove">
  🥊
</div><div id="trampoline">
  <div class="trampoline-surface"></div>
  <div class="trampoline-legs"></div>
</div><div id="electricCubes">
  <div class="cube cube1"></div>
  <div class="cube cube2"></div>
  <div class="cube cube3"></div>
  <div class="cube cube4"></div>
  <div class="cube cube5"></div>
  <div class="cube-countdown">3</div>
</div><div id="batteryLaser">
  <div class="battery-body">🔋</div>
  <div class="battery-wire"></div>
  <div class="battery-laser"></div>
  <div class="battery-countdown">3</div>
</div><div id="dog">
  <div id="dogBody"></div>
  <div id="dogHead"></div>
  <div id="dogEarLeft"></div>
  <div id="dogEarRight"></div>
  <div id="dogEyeLeft"></div>
  <div id="dogEyeRight"></div>
  <div id="dogNose"></div>
  <div id="dogLeg1"></div>
  <div id="dogLeg2"></div>
  <div id="dogTail"></div>
  <div id="dogAccessory"></div>
</div>  </div>  <button id="gameBackButton">
    ⬅
  </button></div></body>
</html>
